# CI/CD: en cada cambio se comprueba el código y la calidad de la búsqueda; si todo pasa en
# `main`, se publica la demo copiando `main` a la rama `deploy`, que es la que despliega
# Streamlit Community Cloud. Así la demo solo recibe código que ha pasado los tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Si llegan dos cambios seguidos, la ejecución vieja se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    name: Tests rápidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Los fragmentos no están en git: se generan a partir de los PDF del BOE.
      - run: uv run python -m rag_consorcio.trocear
      - run: uv run pytest -m "not modelo" -q

  evaluacion:
    name: Tests con el modelo y evaluación de la búsqueda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # El modelo de embeddings (~450 MB) se guarda entre ejecuciones.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-onnx-v1
      - run: uv run python -m rag_consorcio.trocear
      - run: uv run python -m rag_consorcio.embeddings
      - run: uv run pytest -m modelo -q
      # Evaluación como test: si el recall@5 de la configuración principal baja del 78 %
      # (hoy es del 80 %), el CI falla igual que si se rompiera una función.
      - run: uv run python -m rag_consorcio.evaluar --umbral 0.78

  desplegar:
    name: Publicar la demo
    needs: [lint, tests, evaluacion]
    # Solo en cambios ya integrados en main, nunca en pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `deploy` es siempre una copia exacta del último main que pasó el CI.
      - run: git push --force origin HEAD:refs/heads/deploy
